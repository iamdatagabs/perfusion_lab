spring:
  application:
    name: perfusionlab
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:perfusionlab}}
    username: ${DB_USER:perfusionlab}
    password: ${DB_PASSWORD:perfusionlab_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:perfusionlab}
    password: ${RABBITMQ_PASSWORD:perfusionlab_dev}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        concurrency: ${WORKER_SLOTS:1}
        max-concurrency: ${WORKER_SLOTS:1}
        default-requeue-rejected: false

perfusion:
  admin:
    token: ${PERFUSION_ADMIN_TOKEN:}
  role: ${PERFUSION_ROLE:api}
  outbox:
    poll-ms: ${OUTBOX_POLL_MS:500}
  worker:
    heartbeat-ms: ${WORKER_HEARTBEAT_MS:30000}
    recovery-ms: ${WORKER_RECOVERY_MS:15000}
    drain-reconcile-ms: ${WORKER_DRAIN_RECONCILE_MS:5000}
    profile: ${PERFUSION_WORKER_PROFILE:GENERAL}
    node-id: ${WORKER_NODE_ID:}
    cpu-cores: ${WORKER_CPU_CORES:1}
    memory-mb: ${WORKER_MEMORY_MB:2048}
    slots: ${WORKER_SLOTS:1}

server:
  port: ${PORT:8080}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-}]"

info:
  app:
    name: PerfusionLab
    description: Educational CEC simulation platform
