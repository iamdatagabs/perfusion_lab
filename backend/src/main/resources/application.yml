spring:
  application:
    name: perfusionlab-api
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:perfusionlab}
    password: ${RABBITMQ_PASSWORD:perfusionlab_dev}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

info:
  app:
    name: PerfusionLab
    description: Educational CEC simulation platform
