spring:
  application:
    name: perfusionlab-ode-preview
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: PerfusionLab ODE Preview API
    version: 0.2.0
    description: Stateless educational ODE simulation preview
