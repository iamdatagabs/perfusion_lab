services:
  - type: web
    name: perfusionlab-ode-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/ode-preview/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0
