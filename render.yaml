services:
  - type: web
    name: perfusionlab-preview-api
    runtime: node
    rootDir: preview-api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22

  - type: web
    name: perfusionlab-ode-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/ode-preview/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0
