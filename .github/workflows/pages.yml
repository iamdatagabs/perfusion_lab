name: Deploy PerfusionLab MVP
on:
  push:
    branches: [main, "fix/new-mvp-pages-indicators", "feat/cfd-3d-mvp-documentation"]
    paths: ["index.html", "mvp.html", "assets/**", "tests/**", "README.md", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["index.html", "mvp.html", "assets/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test homepage simulator indicators
        run: node --test tests/simulator.test.js
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload new MVP site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
          name: github-pages-\${{ github.run_attempt }}
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-\${{ github.run_attempt }}
