name: CFD foundation CI
on:
  push:
    branches: [main, feat/cfd-3d-mvp-documentation]
    paths: ["cfd/**", ".github/workflows/cfd-ci.yml"]
  pull_request:
    paths: ["cfd/**", ".github/workflows/cfd-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and tests
        run: python -m pip install -e "./cfd[test]"
      - name: Run CFD verification tests
        run: python -m pytest cfd/tests
