services:
  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    container_name: perfusionlab-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: perfusionlab-postgres
    environment:
      POSTGRES_DB: perfusionlab
      POSTGRES_USER: perfusionlab
      POSTGRES_PASSWORD: perfusionlab_dev
    ports:
      - "5432:5432"
    volumes:
      - perfusionlab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfusionlab -d perfusionlab"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: perfusionlab-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: perfusionlab
      RABBITMQ_DEFAULT_PASS: perfusionlab_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - perfusionlab_rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: perfusionlab-api
    environment:
      PERFUSION_ROLE: api
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
      OTEL_SERVICE_NAME: perfusionlab-api
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/perfusionlab
      DB_USER: perfusionlab
      DB_PASSWORD: perfusionlab_dev
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: perfusionlab
      RABBITMQ_PASSWORD: perfusionlab_dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      PERFUSION_ROLE: worker
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
      OTEL_SERVICE_NAME: perfusionlab-worker-general
      PERFUSION_WORKER_PROFILE: GENERAL
      WORKER_CPU_CORES: 1
      WORKER_MEMORY_MB: 2048
      WORKER_SLOTS: 1
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      DATABASE_URL: jdbc:postgresql://postgres:5432/perfusionlab
      DB_USER: perfusionlab
      DB_PASSWORD: perfusionlab_dev
      DB_POOL_SIZE: 5
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: perfusionlab
      RABBITMQ_PASSWORD: perfusionlab_dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker-memory:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      PERFUSION_ROLE: worker
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
      OTEL_SERVICE_NAME: perfusionlab-worker-memory
      PERFUSION_WORKER_PROFILE: MEMORY
      WORKER_CPU_CORES: 2
      WORKER_MEMORY_MB: 8192
      WORKER_SLOTS: 1
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      DATABASE_URL: jdbc:postgresql://postgres:5432/perfusionlab
      DB_USER: perfusionlab
      DB_PASSWORD: perfusionlab_dev
      DB_POOL_SIZE: 5
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: perfusionlab
      RABBITMQ_PASSWORD: perfusionlab_dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker-compute:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      PERFUSION_ROLE: worker
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
      OTEL_SERVICE_NAME: perfusionlab-worker-compute
      PERFUSION_WORKER_PROFILE: COMPUTE
      WORKER_CPU_CORES: 4
      WORKER_MEMORY_MB: 4096
      WORKER_SLOTS: 2
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      DATABASE_URL: jdbc:postgresql://postgres:5432/perfusionlab
      DB_USER: perfusionlab
      DB_PASSWORD: perfusionlab_dev
      DB_POOL_SIZE: 5
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: perfusionlab
      RABBITMQ_PASSWORD: perfusionlab_dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  perfusionlab_pgdata:
  perfusionlab_rabbitdata:
